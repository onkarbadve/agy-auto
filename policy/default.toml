go_readonly = ["build", "test", "vet", "fmt", "version", "env", "list", "mod tidy", "mod download", "mod verify", "doc", "run", "generate", "help"]
make_forbidden_targets = ["install", "uninstall", "deploy", "publish", "release", "push", "clean", "distclean", "docker-push", "upload"]
podman_readonly = ["ps", "images", "logs", "inspect", "version", "info", "stats", "top", "port", "diff", "history", "image ls", "image list", "container ls", "container list", "volume ls", "network ls", "pod ps", "search", "--version", "system df"]
systemctl_readonly = ["status", "list-units", "list-unit-files", "list-timers", "list-sockets", "list-dependencies", "is-active", "is-enabled", "is-failed", "is-system-running", "show", "cat", "--version", "list-jobs", "get-default", "show-environment"]
