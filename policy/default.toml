python_readonly_modules = ["pytest", "unittest", "json.tool", "py_compile", "compileall", "pip list", "pip show", "pip freeze", "venv --help", "this", "site", "sysconfig", "tokenize", "ast", "pydoc", "http.client", "timeit", "pyflakes", "black --check", "mypy", "ruff"]
# Domains for which a plain GET (curl/wget with no data flags) is fast-allowed.
allowed_domains = ["github.com", "api.github.com", "raw.githubusercontent.com", "objects.githubusercontent.com", "gitlab.com", "pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "crates.io", "static.crates.io", "index.crates.io", "proxy.golang.org", "sum.golang.org", "huggingface.co", "hf.co", "docs.python.org", "developer.mozilla.org", "go.dev", "pkg.go.dev", "docs.rs", "doc.rust-lang.org", "nodejs.org", "npmjs.com", "www.npmjs.com", "localhost", "127.0.0.1", "[::1]", "antigravity.google", "cloud.google.com", "developers.google.com", "ai.google.dev", "stackoverflow.com", "wikipedia.org", "en.wikipedia.org"]
# Safe environment variables that fast-allow may expand.
env_whitelist = ["HOME", "PWD", "USER", "LOGNAME", "PATH", "SHELL", "TERM", "LANG", "LC_ALL", "OLDPWD", "HOSTNAME", "TMPDIR", "EDITOR", "PAGER"]
max_sleep_seconds = 300

[tools]
# Tools that are always allowed (their effects are visible to the user or harmless).
allow = ["command_status", "send_command_input", "notify_user", "ask_question", "manage_task", "schedule", "list_permissions", "ask_permission", "invoke_subagent", "define_subagent", "manage_subagents", "send_message", "generate_image", "search_web", "view_code_item", "read_terminal", "view_file_outline", "view_web_document_content_chunk", "view_content_chunk", "code_search", "grep_search", "find_by_name", "list_dir", "view_file"]
# Tools whose argument names hold a path the engine must classify.
read_path_args = { view_file = "AbsolutePath", list_dir = "DirectoryPath", grep_search = "SearchPath", find_by_name = "SearchDirectory", view_code_item = "File", view_file_outline = "AbsolutePath", code_search = "SearchPath" }
write_path_args = { write_to_file = "TargetFile", replace_file_content = "TargetFile", multi_replace_file_content = "TargetFile", create_file = "TargetFile", delete_file = "TargetFile", edit_file = "TargetFile" }
url_args = { read_url_content = "Url", open_browser_url = "Url", browser_subagent = "Url" }
# URL hosts that are always denied (cloud metadata, link-local).
denied_hosts = ["169.254.169.254", "metadata.google.internal", "metadata", "100.100.100.200", "fd00:ec2::254", "[fd00:ec2::254]"]
max_url_query_chars = 300
