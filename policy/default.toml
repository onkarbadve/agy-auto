# Sub-command allow lists for multi-purpose tools (first non-option argument).
git_readonly = ["status", "log", "diff", "show", "branch", "tag", "remote", "ls-files", "ls-tree", "ls-remote", "cat-file", "rev-parse", "rev-list", "describe", "blame", "shortlog", "stash", "config", "grep", "fetch", "worktree", "reflog", "help", "version", "check-ignore", "count-objects", "name-rev", "merge-base", "cherry", "whatchanged", "var", "symbolic-ref", "for-each-ref", "diff-tree", "diff-index", "diff-files", "show-ref", "verify-commit", "verify-tag", "notes", "bisect"]
